name: CustomCommands
version: 1.0
main: com.aura.customcommands.CustomCommandsPlugin
api-version: 1.16
description: Custom commands for testing
commands:
  spawnancientdebris:
    description: Spawn a 30x30x30 cube of ancient debris
    usage: /spawnancientdebris
  spawndiamonds:
    description: Spawn a 30x30x30 cube of diamonds
    usage: /spawndiamonds
  makebox:
    description: Make a hollow box with wooden planks
    usage: /makebox <size>
  spawn:
    description: Spawn any block type in a cube
    usage: /spawn <block_name> [size]
  lobby:
    description: Join a lobby/gamemode
    usage: /lobby <gamemode>
  givearmor:
    description: Give yourself full enchanted netherite armor
    usage: /givearmor
  givesword:
    description: Give yourself a fully enchanted netherite sword
    usage: /givesword
  removewarp:
    description: Remove a warp point
    usage: /removewarp <warpname>
  admin:
    description: Make a player an admin
    usage: /admin <username>
  nocheats:
    description: Destroy all command blocks on the server
    usage: /nocheats
  player:
    description: Test command - makes you a regular player
    usage: /player
  unplayer:
    description: Test command - makes you owner again
    usage: /unplayer
