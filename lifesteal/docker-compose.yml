version: '3.8'

services:
  minecraft:
    build: .
    container_name: lifesteal_minecraft
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "1.21.11"
      MEMORY: "8G"
      ONLINE_MODE: "false"
      DIFFICULTY: "hard"
      PVP: "true"
      SPAWN_PROTECTION: "0"
    volumes:
      - minecraft_data:/data
      - ./plugins:/data/plugins
    restart: unless-stopped

volumes:
  minecraft_data:
    driver: local
